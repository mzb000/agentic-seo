[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mz-seo-agent"
version = "1.0.0"
description = "Autonomous multi-agent SEO audit and optimization platform"
authors = [{ name = "MZ" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "urllib3>=2.0.0",
]

[project.scripts]
mz-seo = "cli:main"
